spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/library_test}
spring.datasource.username=${TEST_DB_USERNAME:library}
spring.datasource.password=${TEST_DB_PASSWORD:devpassword}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true